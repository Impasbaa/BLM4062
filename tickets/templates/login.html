{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0 p-4 rounded-4">
            <h3 class="fw-bold text-center mb-4 text-primary">Oturum Aç</h3>
            
            {% if hata %}
                <div class="alert alert-danger">{{ hata }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Kullanıcı Adı</label>
                    <input type="text" name="username" class="form-control" placeholder="Kullanıcı adınızı giriniz" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Şifre</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold shadow-sm mb-3">Giriş Yap</button>
                
                <div class="text-center mb-3">
                    <span class="text-muted">veya</span>
                </div>
                <a href="/" class="btn btn-outline-secondary w-100 fw-bold mb-3">
                    <i class="bi bi-person-x"></i> Üye Olmadan Devam Et
                </a>
            </form>
            
            <p class="text-center mb-0 text-muted">
                Hesabınız yok mu? <a href="{% url 'register' %}" class="text-decoration-none font-weight-bold">Şimdi Kayıt Ol</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
