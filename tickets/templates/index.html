{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0 rounded-lg">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0">Nereye?</h4>
            </div>
            <div class="card-body p-4">
                <form action="{% url 'search' %}" method="GET" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Nereden</label>
                        <select name="nereden" class="form-select" required>
                            <option value="">Seçiniz...</option>
                            {% for sehir in sehirler %}
                                <option value="{{ sehir.id }}">{{ sehir.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Nereye</label>
                        <select name="nereye" class="form-select" required>
                            <option value="">Seçiniz...</option>
                            {% for sehir in sehirler %}
                                <option value="{{ sehir.id }}">{{ sehir.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Gidiş Tarihi <span class="text-muted fw-normal"></span></label>
                        <input type="date" name="tarih" class="form-control" min="{{ bugun|date:'Y-m-d' }}">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                            <i class="bi bi-search"></i> Bilet Bul
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
